version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: portfolio-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portfolio_db}
      MYSQL_USER: ${MYSQL_USER:-portfolio_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-portfolio_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    ports:
      - "3306:3306"
    volumes:
      - portfolio_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-portfolio_user}", "-p${MYSQL_PASSWORD:-portfolio_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  portfolio-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-api:latest
    container_name: portfolio-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-portfolio_db}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-portfolio_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-portfolio_pass}
      MARKET_API_BASE_URL: ${MARKET_API_BASE_URL:-https://c4rm9elh30.execute-api.us-east-1.amazonaws.com/default}
    ports:
      - "8080:8080"

volumes:
  portfolio_mysql_data:
