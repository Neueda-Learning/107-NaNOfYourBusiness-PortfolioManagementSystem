# Development profile - uses embedded H2 database (no MySQL required)
spring.application.name=portfolio

# H2 Embedded Database
spring.datasource.url=jdbc:h2:mem:portfolio_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Initialize database from schema.sql on startup
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-dev.sql

# H2 console for debugging (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# External market data
market.api.base-url=${MARKET_API_BASE_URL:https://c4rm9elh30.execute-api.us-east-1.amazonaws.com/default}
market.supported-tickers=AAPL,MSFT,GOOGL,AMZN,META,NVDA,TSLA,AMD,INTC,NFLX,JPM,BAC,WFC,V,MA,DIS,KO,PEP,PFE,JNJ,XOM,CVX,T,CSCO

# Finnhub config
finnhub.base-url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
finnhub.api-key=${FINNHUB_API_KEY:}

# Scheduled batch poll interval (ms). 10 s is the recommended POC default.
market.poll.interval-ms=10000

# Number of symbols refreshed per scheduler tick.
marketdata.batch-size=8

# Server
server.port=8080

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
