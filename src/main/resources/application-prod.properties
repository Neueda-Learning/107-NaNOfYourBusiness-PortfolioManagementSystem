# Production profile - uses MySQL database
spring.application.name=portfolio

# Database - override via environment variables in CI/prod
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Run schema.sql against real MySQL on startup
spring.sql.init.mode=always

# External market data
market.api.base-url=${MARKET_API_BASE_URL:https://c4rm9elh30.execute-api.us-east-1.amazonaws.com/default}
market.supported-tickers=RELIANCE.NS,TCS.NS,INFY.NS,HDFCBANK.NS,ICICIBANK.NS,SBIN.NS,LT.NS,ITC.NS,HINDUNILVR.NS,AXISBANK.NS,BHARTIARTL.NS,KOTAKBANK.NS,ASIANPAINT.NS,BAJFINANCE.NS,BAJAJFINSV.NS,MARUTI.NS,SUNPHARMA.NS,TITAN.NS,ULTRACEMCO.NS,NESTLEIND.NS,POWERGRID.NS,NTPC.NS,TATAMOTORS.NS,M&M.NS,WIPRO.NS,HCLTECH.NS,TECHM.NS,ADANIENT.NS,ADANIPORTS.NS,JSWSTEEL.NS,TATASTEEL.NS,HINDALCO.NS,ONGC.NS,COALINDIA.NS,INDUSINDBK.NS,DRREDDY.NS,CIPLA.NS,EICHERMOT.NS,GRASIM.NS,HEROMOTOCO.NS,APOLLOHOSP.NS,BRITANNIA.NS,DIVISLAB.NS,BPCL.NS,SHRIRAMFIN.NS,SBILIFE.NS,HDFCLIFE.NS,BAJAJ-AUTO.NS,TRENT.NS,BEL.NS,HAL.NS,IRCTC.NS,DMART.NS,PIDILITIND.NS,DLF.NS,SIEMENS.NS,GODREJCP.NS,ZOMATO.NS,PAYTM.NS,NYKAA.NS,INDIGO.NS

