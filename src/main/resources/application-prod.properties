# Production profile - uses MySQL database
spring.application.name=portfolio

# Database - override via environment variables in CI/prod
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Run schema.sql against real MySQL on startup
spring.sql.init.mode=always

# External market data
market.api.base-url=${MARKET_API_BASE_URL:https://c4rm9elh30.execute-api.us-east-1.amazonaws.com/default}
market.supported-tickers=AAPL,MSFT,GOOGL,AMZN,META,NVDA,TSLA,AMD,INTC,NFLX,JPM,BAC,WFC,V,MA,DIS,KO,PEP,PFE,JNJ,XOM,CVX,T,CSCO

# Finnhub config
finnhub.base-url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
finnhub.api-key=${FINNHUB_API_KEY:}

# Scheduled staggered refresh
market.poll.interval-ms=10000
marketdata.batch-size=8

# Server
server.port=8080

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

