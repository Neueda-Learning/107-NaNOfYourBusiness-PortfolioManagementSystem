spring.application.name=portfolio

# Optional local overrides (e.g., SPRING_DATASOURCE_PASSWORD) for developer machines.
spring.config.import=optional:file:.env[.properties]

# Use the H2-backed dev profile unless a profile is explicitly provided.
spring.profiles.default=dev

# External market data
market.api.base-url=${MARKET_API_BASE_URL:https://c4rm9elh30.execute-api.us-east-1.amazonaws.com/default}
market.supported-tickers=AAPL,MSFT,GOOGL,AMZN,META,NVDA,TSLA,AMD,INTC,NFLX,JPM,BAC,WFC,V,MA,DIS,KO,PEP,PFE,JNJ,XOM,CVX,T,CSCO

# Finnhub config
finnhub.base-url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
finnhub.api-key=${FINNHUB_API_KEY:}

# Scheduled batch poll interval (ms). Tune down to 5000 in prod if Yahoo holds up.
market.poll.interval-ms=10000

# Number of symbols refreshed per scheduler tick.
# With a 10s fixed rate and default 8, we stay under ~60 calls/min on free tier.
marketdata.batch-size=8

# Mutual fund API
mfapi.base-url=${MFAPI_BASE_URL:https://api.mfapi.in}

# Twelve Data API (historical stock chart data: open/high/low/close/volume).
# Free tier: 800 credits/day, capped at 8 calls/minute. Fetched on-demand when a
# user opens a chart (not polled), so no cache+stagger scheduling is needed here.
twelvedata.base-url=${TWELVEDATA_BASE_URL:https://api.twelvedata.com}
twelvedata.api-key=${TWELVE_DATA_API_KEY:}

# Server
server.port=8080

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
