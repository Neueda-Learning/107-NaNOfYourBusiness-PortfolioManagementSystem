# Test datasource ? H2 in-memory, no MySQL required
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Spring run schema.sql against H2 on test startup
spring.sql.init.mode=always
spring.task.scheduling.enabled=false

# Disable external market data calls in tests
market.api.base-url=http://localhost:9999/stub
market.supported-tickers=AAPL,TSLA
finnhub.base-url=http://localhost:9999/stub
finnhub.api-key=test-key
marketdata.batch-size=2

